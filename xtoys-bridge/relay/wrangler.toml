name = "jveraxs-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The bridge page is bundled into the Worker as plain text.
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# SQLite-backed Durable Objects are available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# The SECRET is NOT stored here. Add it in the Cloudflare dashboard:
# Worker -> Settings -> Variables and Secrets -> Add -> Type "Secret", name "SECRET".
